# Grafana admin login, synced from AWS Secrets Manager. The SecretStore's IRSA
# role can read only this one secret; the value never appears in Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-secretstore
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "secretStoreRoleArn is required" .Values.secretStoreRoleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-secretstore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-admin          # grafana.admin.existingSecret in platform/monitoring
    creationPolicy: Owner
  dataFrom:
    - extract:                   # JSON keys admin-user / admin-password become Secret keys
        key: {{ required "grafanaAdminSecret is required" .Values.grafanaAdminSecret | quote }}
