# Every dashboards/*.json becomes a ConfigMap; Grafana's sidecar loads ConfigMaps
# labelled grafana_dashboard. The app namespace is substituted into the queries.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | replace "__APP_NAMESPACE__" $.Values.appNamespace | indent 4 }}
{{- end }}
