apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "backend.labels" . | nindent 8 }}
        lab-commit/db-access: "true"        # gets the RDS security group (SecurityGroupPolicy)
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false   # no Kubernetes API access; the IRSA token is mounted separately
      securityContext:
        {{- include "backend.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "backend.selectorLabels" . | nindent 14 }}
      containers:
        - name: backend
          image: {{ include "backend.image" . }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "backend.dbEnv" . | nindent 12 }}
          readinessProbe:            # checks the database (SELECT 1)
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:             # process only, so a database outage does not restart pods
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "backend.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
