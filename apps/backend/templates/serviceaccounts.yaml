# One ServiceAccount per job, each with its own IRSA role (least privilege).
# Wave -2: they must exist before the migration job (wave -1) and the Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.backend.roleArn is required" .Values.serviceAccounts.backend.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrator
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.dbMigrator.roleArn is required" .Values.serviceAccounts.dbMigrator.roleArn | quote }}
automountServiceAccountToken: false
