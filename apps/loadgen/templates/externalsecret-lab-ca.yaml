# The lab CA certificate, synced from SSM Parameter Store into Secret "lab-ca".
# The SecretStore's IRSA role can read only this one parameter; the certificate
# is not stored in Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-secretstore
  labels:
    {{- include "loadgen.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "secretStoreRoleArn is required" .Values.secretStoreRoleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameter-store
  labels:
    {{- include "loadgen.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "region is required" .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-secretstore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-ca
  labels:
    {{- include "loadgen.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: lab-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: {{ required "caCertParameter is required" .Values.caCertParameter | quote }}
